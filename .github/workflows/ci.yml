name: CI

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'MattGPT.slnx'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.x'
          # .NET 11 is now in stable RC, so is safe to use. When it goes GA this can be removed.
          dotnet-quality: 'preview'

      - name: Install npm dependencies (Tailwind CSS)
        run: npm install
        working-directory: src/UI/MattGPT.Web

      - name: Restore dependencies
        run: dotnet restore MattGPT-NoMAUI.slnf

      - name: Build
        run: dotnet build MattGPT-NoMAUI.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test MattGPT-NoMAUI.slnf --no-build --configuration Release --verbosity normal
